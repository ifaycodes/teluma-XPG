name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teluma-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: teluma-frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Byte-compile every module
        run: python -m compileall -q .
      - name: Import the app (catches missing env vars, bad imports, etc.)
        env:
          SUPABASE_URL: "http://localhost"
          SUPABASE_ANON_KEY: "test"
          DATABASE_URL: "sqlite:///:memory:"
          GCS_BUCKET_VAULT: "test"
          GCS_BUCKET_AGENT: "test"
        run: python -c "import main; print('app import OK, routes:', len(main.app.routes))"

  deploy:
    name: Trigger Render deploy
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Hit Render's deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set — skipping. See .github/workflows/ci.yml for setup steps."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
