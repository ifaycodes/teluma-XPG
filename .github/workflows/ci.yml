name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teluma-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: teluma-frontend/package-lock.json
      - run: npm ci
      - name: Build (dummy env — this build isn't deployed, Vercel builds separately with real values)
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build

  backend:
    name: Backend compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Byte-compile every module
        run: python -m compileall -q .
      - name: Import the app (catches missing env vars, bad imports, etc.)
        env:
          SUPABASE_URL: "http://localhost"
          SUPABASE_ANON_KEY: "test"
          DATABASE_URL: "sqlite:///:memory:"
          GCS_BUCKET_VAULT: "test"
          GCS_BUCKET_AGENT: "test"
        run: |
          python -c "
          import json, os
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa

          # storage.py needs a syntactically-real (but throwaway) service-account
          # key so google-auth's PEM parsing succeeds without any network call —
          # a plain fake string here would fail to parse as a private key
          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          pem = key.private_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PrivateFormat.PKCS8,
              encryption_algorithm=serialization.NoEncryption(),
          ).decode()
          os.environ['GOOGLE_APPLICATION_CREDENTIALS_JSON'] = json.dumps({
              'type': 'service_account',
              'project_id': 'ci-test',
              'private_key_id': 'ci',
              'private_key': pem,
              'client_email': 'ci@ci-test.iam.gserviceaccount.com',
              'client_id': '000000000000000000000',
              'auth_uri': 'https://accounts.google.com/o/oauth2/auth',
              'token_uri': 'https://oauth2.googleapis.com/token',
              'auth_provider_x509_cert_url': 'https://www.googleapis.com/oauth2/v1/certs',
              'client_x509_cert_url': 'https://www.googleapis.com/robot/v1/metadata/x509/ci%40ci-test.iam.gserviceaccount.com',
              'universe_domain': 'googleapis.com',
          })

          import main
          print('app import OK, routes:', len(main.app.routes))
          "

  deploy:
    name: Trigger Render deploy
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Hit Render's deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set — skipping. See .github/workflows/ci.yml for setup steps."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
